<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.fanficsTitle">Acervo de fanfics | JemmaVerso Archive</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="fanfic-page">
<main class="content">
  <header class="page-topbar">
    <a class="home-link" href="index.html" data-i18n="page.homeTitle">JemmaVerso Archive</a>
    <label class="language-control"><span data-i18n="language.label">Idioma</span>
      <select id="languageSelector" aria-label="Idioma" data-i18n-aria-label="language.label">
        <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option>
      </select>
    </label>
  </header>
  <section class="construction-hero">
    <img class="construction-image" src="fanfics-wenclair.png" alt="Enid e Wednesday juntas" data-i18n-alt="about.imageAlt">
    <div class="construction-copy">
        <h1 data-i18n="fanfics.title">Acervo de fanfics</h1>
      <h2 data-i18n="fanfics.construction">Em construção</h2>
      <p data-i18n="fanfics.description">Estamos preparando um cantinho especial para reunir ainda mais histórias. Volte em breve! ♡</p>
      <a class="construction-back" href="index.html" data-i18n="common.backHome">← Voltar ao acervo</a>
    </div>
  </section>
  <section class="fanfic-recommendations" aria-labelledby="recommendationsTitle">
    <h2 id="recommendationsTitle" data-i18n="fanfics.recommendationsTitle">Enquanto você espera, aproveite algumas recomendações:</h2>
    <div class="fanfic-carousel">
      <button class="fanfic-carousel-arrow fanfic-carousel-previous" type="button" aria-label="Recomendações anteriores">‹</button>
      <div class="fanfic-carousel-viewport">
        <div id="fanficRecommendations" class="fanfic-cards" aria-live="off"></div>
      </div>
      <button class="fanfic-carousel-arrow fanfic-carousel-next" type="button" aria-label="Próximas recomendações">›</button>
    </div>
  </section>
</main>
<dialog id="fanficDialog" class="fanfic-dialog" aria-labelledby="fanficDialogTitle">
  <div class="fanfic-dialog-box">
    <button id="closeFanficDialog" class="close" type="button" aria-label="Fechar detalhes" data-i18n-aria-label="fanfics.closeDetails">✕</button>
    <img id="fanficDialogCover" class="fanfic-dialog-cover" alt="">
    <div class="fanfic-dialog-copy">
      <a id="fanficDialogAuthor" class="author fanfic-author" target="_blank" rel="noopener noreferrer"></a>
      <h2 id="fanficDialogTitle"></h2>
      <h3 data-i18n="modal.synopsis">Sinopse</h3>
      <p id="fanficDialogDescription" class="fanfic-dialog-description"></p>
      <a id="fanficDialogLink" class="read-btn" target="_blank" rel="noopener noreferrer" data-i18n="fanfics.readWattpad">Ler no Wattpad ↗</a>
    </div>
  </div>
</dialog>
<script src="fanfics-data.js"></script>
<script src="fanfics.js"></script>
<script src="translations-extra.js"></script>
<script src="i18n.js"></script>
<script src="sparkles.js"></script>
</body>
</html>
